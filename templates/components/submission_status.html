{% load i18n %}{# Estado de una entrega con su par de color de DESIGN.md y siempre con palabras. Recibe `submission`. #}
<p class="m-0 inline-flex items-center gap-1.5 self-start rounded-full px-3 py-1.5 font-mono text-code-sm {% if submission.status == 'approved' %}bg-tested-container text-tested{% elif submission.status == 'changes_requested' %}bg-revalidate-container text-revalidate{% elif submission.status == 'in_review' %}bg-primary-container text-on-primary-container{% else %}bg-surface-chip text-ink-muted{% endif %}">{% translate "Estado" %}: {{ submission.get_status_display }}</p>

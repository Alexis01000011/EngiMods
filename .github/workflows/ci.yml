name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-solo-para-pruebas
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Migraciones al día
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: uv run pytest
      - name: Backlog consistente
        run: uv run python scripts/backlog.py
      - name: Skills enlazadas para Codex
        run: |
          for d in .claude/skills/*/; do
            n=$(basename "$d")
            test "$(readlink ".agents/skills/$n")" = "../../.claude/skills/$n" ||
              { echo "Falta el enlace .agents/skills/$n (ver AGENTS.md, sección 10)"; exit 1; }
          done

name: Bug
description: Algo que ya estaba entregado no funciona como debe
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: input
    id: historia
    attributes:
      label: Historia relacionada
      placeholder: "EM-0XX"

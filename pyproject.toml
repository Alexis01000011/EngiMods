[project]
name = "engimods"
version = "0.1.0"
requires-python = ">=3.12"
description = "Academia en línea para aprender a crear mods de videojuegos con ingeniería de software"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "django-tailwind-cli>=4.8.2",
    "markdown>=3.11",
    "nh3>=0.3",
    "stripe>=16.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "double"
